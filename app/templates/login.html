<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login - Flight DBMS</title></head>
<body style="font-family:Arial;margin:18px;">
  <h2>Login</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div style="padding:10px;margin:10px 0;background:#ffe6e6;">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post" action="/login">
    <div><label>Username</label><br><input name="username" /></div>
    <div><label>Password</label><br><input name="password" type="password" /></div>
    <button type="submit">Login</button>
  </form>
  <p>No account? <a href="/register">Register</a></p>
</body>
</html>
